name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest fastapi httpx
      - run: pytest -q
      - name: Workflow JSON is valid
        run: python -c "import json; json.load(open('workflows/ai-lead-triage.json'))"
